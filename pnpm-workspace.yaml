# SEC FORK: pnpm 12 settings live here (package.json "pnpm" field is no longer read).
# These overrides pin the exact versions audited in the npm package-lock.json graph
# (upstream's npm `overrides` are silently dropped by `pnpm import`).
# Merge checklist: if upstream changes its `overrides` block, update the pins here,
# re-run `corepack pnpm import && corepack pnpm install --frozen-lockfile`, and
# re-run the graph diff + node scripts/sec-audit-families.mjs before trusting.
overrides:
  "@hono/node-server": 2.0.11
  hono: 4.13.8
  js-yaml: 4.3.2
  nanoid: 3.3.18

# --- Seguridad de supply chain (verificada contra pnpm 12.8.1) -----------------
# Puerta de curado ("minimum release age"): pnpm no resuelve versiones publicadas
# hace menos de este tiempo. UNIDAD: MINUTOS. 10080 = 7 días.
# La versión más joven del grafo auditado tiene 9 días (AUDIT-FAMILIAS-*.md),
# así que 7 días pasa con margen. Para curado largo (30 d = 43200, 60 d = 86400)
# los pins nuevos tras cada merge upstream deberán envejecer o excluirse:
#   minimumReleaseAgeExclude: ["@posthog/core"]
minimumReleaseAge: 10080
# Exclusiones de la puerta (solo para parches de seguridad urgentes):
minimumReleaseAgeExclude: []
# Allowlist de scripts de ciclo de vida de dependencias: NINGUNO puede ejecutarse.
# (hoy no hace falta ninguno; el escaneo de node_modules no encuentra install scripts)
onlyBuiltDependencies: []
# Tripwire: fallar el install si una dependencia nueva trae scripts bloqueados,
# en lugar de continuar con un aviso fácil de perder.
strictDepBuilds: true
# Fallar cualquier script npm si node_modules no coincide con el lockfile:
verifyDepsBeforeRun: error
# Exigir engines.node (>=20.19) de forma estricta:
engineStrict: true
# Fijar siempre versiones exactas al añadir dependencias nuevas:
saveExact: true
